gitlab-runner:
  fullnameOverride: gitlab-runner
  gitlabUrl: https://<path:forge-dso/data/env/conf-dso/apps/common/values#domain |
    jsonPath {.gitlab}>/
  image:
    registry: <path:forge-dso/data/env/conf-dso/apps/common/values#image | jsonPath
      {.repository.gitlab}>/gitlab-org
  rbac:
    create: true
    podSecurityPolicy:
      enabled: true
    rules:
    - resources:
      - configmaps
      - events
      - pods
      - pods/attach
      - pods/exec
      - secrets
      - services
      verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
    - apiGroups:
      - ''
      resources:
      - pods/exec
      verbs:
      - create
      - patch
      - delete
    serviceAccountName: gitlab-runner
  replicas: 1
  resources:
    limits:
      ephemeral-storage: 2Gi
    requests:
      ephemeral-storage: 500Mi
  revisionHistoryLimit: 2
  runnerToken: <path:forge-dso/data/env/conf-dso/apps/gitlab/values#runnerToken>
  runners:
    config: "[[runners]]\n  [runners.kubernetes]\n    namespace = \"dso-gitlab\"\n
      \   image = \"ubuntu:22.04\"\n    # multiple \"always\" to retry pull on fail
      (see. https://docs.gitlab.com/runner/executors/kubernetes.html#set-a-pull-policy)\n
      \   pull_policy = [\"always\", \"always\"]\n"
    name: gitlab-runner
    secret: gitlab-runner-secret
  volumeMounts:
  - mountPath: /.gitlab-runner
    name: root-gitlab-runner
  volumes:
  - emptyDir:
      medium: Memory
    name: root-gitlab-runner
